<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Página no encontrada | José Manuel León</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #f6f7f9; --text: #131a2a; --muted: #566074; --accent: #2546c4; --on-accent: #fff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0e1420; --text: #e9edf4; --muted: #a1abbd; --accent: #8fa8ff; --on-accent: #0e1420; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: "Schibsted Grotesk", system-ui, sans-serif; }
    main { max-width: 32rem; padding: 32px 16px; }
    h1 { margin: 0; font-family: Georgia, serif; font-weight: 400; font-size: 2.4rem; line-height: 1.15; }
    p { margin: 12px 0 0; color: var(--muted); }
    a { display: inline-block; margin-top: 24px; padding: 12px 18px; border-radius: 10px; background: var(--accent); color: var(--on-accent); text-decoration: none; font-weight: 600; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Esta página no existe.</h1>
    <p>Puede que el enlace esté mal escrito o que la página se haya movido.</p>
    <a href="./">Ir al portfolio</a>
  </main>
</body>
</html>
